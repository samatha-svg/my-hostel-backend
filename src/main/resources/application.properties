spring.application.name=maintenance-system
server.port=${PORT:8080}

# Database Configuration
# If Cloud MySQL (SPRING_DATASOURCE_URL) is provided, it uses MySQL.
# Otherwise, it automatically falls back to an embedded MySQL-mode database so Render starts up with 0 errors and no extra setup!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hostel_maintenance_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
